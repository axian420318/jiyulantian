<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D20 骰子展示</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #info {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      color: #ffffff;
      background: rgba(0,0,0,0.5);
      padding: 8px 0;
      pointer-events: none;
      font-size: 14px;
      letter-spacing: 1px;
    }
    a {
      color: #ffaa00;
      pointer-events: auto;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div id="info">
    🎲 D20 | 鼠标拖动旋转 · 滚轮缩放 | <a href="https://github.com/你的用户名/你的仓库" target="_blank">GitHub</a>
  </div>

  <!-- 引入 Three.js 核心库、加载器和控制器 -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // ---------- 初始化场景、相机、渲染器 ----------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);   // 深蓝紫背景

    const camera = new THREE.PerspectiveCamera(
      45, window.innerWidth / window.innerHeight, 0.1, 100
    );
    camera.position.set(4, 3, 5);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // 限制过高像素比，提升性能
    renderer.shadowMap.enabled = true;        // 开启阴影（如果模型有）
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    // ---------- 灯光 ----------
    // 环境光提供基础亮度
    const ambient = new THREE.AmbientLight(0x404066, 2.5);
    scene.add(ambient);

    // 主光源（方向光模拟阳光）
    const keyLight = new THREE.DirectionalLight(0xffffff, 4);
    keyLight.position.set(5, 8, 5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 1024;
    keyLight.shadow.mapSize.height = 1024;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 50;
    keyLight.shadow.camera.left = -10;
    keyLight.shadow.camera.right = 10;
    keyLight.shadow.camera.top = 10;
    keyLight.shadow.camera.bottom = -10;
    scene.add(keyLight);

    // 补光（背面和底部加一点颜色）
    const fillLight1 = new THREE.DirectionalLight(0xcc88ff, 1.5);
    fillLight1.position.set(-3, 1, -4);
    scene.add(fillLight1);

    const fillLight2 = new THREE.DirectionalLight(0x88ccff, 2);
    fillLight2.position.set(0, -2, 0);
    scene.add(fillLight2);

    // ---------- 地面网格和简单平台（可选） ----------
    const gridHelper = new THREE.GridHelper(6, 20, 0x444466, 0x222244);
    scene.add(gridHelper);

    // 一个半透明圆盘让骰子看起来“放在上面”
    const platformGeometry = new THREE.CylinderGeometry(1.3, 1.3, 0.05, 64);
    const platformMaterial = new THREE.MeshStandardMaterial({
      color: 0x335577,
      roughness: 0.4,
      metalness: 0.3,
      transparent: true,
      opacity: 0.7
    });
    const platform = new THREE.Mesh(platformGeometry, platformMaterial);
    platform.position.y = -0.7;
    platform.receiveShadow = true;
    scene.add(platform);

    // ---------- 加载 GLB 模型 ----------
    const loader = new GLTFLoader();
    // 替换 "d20.glb" 为你的实际文件名（与 HTML 放在同一目录下）
    loader.load(
      'd20.glb',
      (gltf) => {
        const model = gltf.scene;
        
        // 让模型居中并自动缩放适配
        model.position.set(0, 0, 0);
        
        // 自动计算包围盒，把模型放到平台上
        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        
        // 移动到原点（水平居中，底部刚好在 y=0 附近）
        model.position.x = -center.x;
        model.position.z = -center.z;
        // 让模型底部接触平台表面 (平台顶部 y ≈ 0.3)
        model.position.y = -box.min.y + 0.35;

        // 如果模型太大或太小，可以统一缩放
        const maxDim = Math.max(size.x, size.y, size.z);
        if (maxDim > 3) {
          const scale = 3 / maxDim;
          model.scale.set(scale, scale, scale);
        }

        // 开启阴影
        model.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            // 让材质看起来更光滑（可根据你的模型调整）
            if (child.material) {
              child.material.roughness = 0.3;
              child.material.metalness = 0.1;
            }
          }
        });

        scene.add(model);

        // 加载完成后隐藏可能存在的加载提示（可自行添加 loading UI）
        console.log('🎲 D20 模型加载成功！');
      },
      (progress) => {
        // 加载进度
        const percent = (progress.loaded / progress.total * 100).toFixed(0);
        console.log(`加载中... ${percent}%`);
      },
      (error) => {
        console.error('❌ 模型加载失败:', error);
        // 可以在屏幕上显示错误信息
        const errorDiv = document.createElement('div');
        errorDiv.style.position = 'absolute';
        errorDiv.style.top = '20px';
        errorDiv.style.left = '20px';
        errorDiv.style.color = 'red';
        errorDiv.style.background = 'rgba(0,0,0,0.7)';
        errorDiv.style.padding = '10px';
        errorDiv.textContent = '模型加载失败，请检查 d20.glb 文件是否存在。';
        document.body.appendChild(errorDiv);
      }
    );

    // ---------- 轨道控制器（鼠标交互） ----------
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.2, 0);
    controls.enableDamping = true;       // 惯性
    controls.dampingFactor = 0.08;
    controls.minDistance = 2;
    controls.maxDistance = 10;
    controls.maxPolarAngle = Math.PI / 1.8;  // 限制角度，防止翻到底部
    controls.autoRotate = true;          // 自动缓慢旋转展示
    controls.autoRotateSpeed = 1.2;
    controls.update();

    // ---------- 窗口大小自适应 ----------
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ---------- 动画循环 ----------
    function animate() {
      requestAnimationFrame(animate);

      controls.update();   // 必须更新控制器

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
