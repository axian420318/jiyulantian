<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f0f1a">
    <title>狼人杀 - 房间管理 (Supabase + Trystero)</title>
    <style>
        :root {
            --bg: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-input: #1e2a45;
            --text: #e8e8f0;
            --text-secondary: #a0a0b8;
            --text-muted: #6b6b85;
            --accent: #5b8def;
            --accent-hover: #4a7dde;
            --accent-glow: rgba(91, 141, 239, 0.25);
            --danger: #ef5b5b;
            --success: #4ade80;
            --warning: #fbbf24;
            --border: #2a2a42;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
            --radius: 16px;
            --radius-sm: 10px;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --header-h: 56px;
            --footer-h: 64px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 16px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
            padding-left: var(--safe-left, 0);
            padding-right: var(--safe-right, 0);
            animation: fadeIn 0.25s ease;
        }
        .screen.active { display: flex; }
        @keyframes fadeIn { from { opacity:0; transform: translateY(8px);} to { opacity:1; transform: translateY(0);} }
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
        @keyframes spin { to { transform: rotate(360deg);} }

        /* 首页 */
        #home-screen {
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at 50% 30%, #1a1a3a 0%, var(--bg) 70%);
            padding: 24px 20px;
        }
        .home-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            animation: slideUp 0.4s ease;
        }
        @keyframes slideUp { from { opacity:0; transform: translateY(24px) scale(0.98);} to { opacity:1; transform: translateY(0) scale(1);} }
        .app-icon {
            width: 80px;
            height: 80px;
            border-radius: 22px;
            background: linear-gradient(135deg, #5b8def 0%, #7b5bef 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 8px 32px var(--accent-glow);
        }
        .app-title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #e8e8f0 0%, #a0b8e8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .app-subtitle { font-size: 14px; color: var(--text-muted); text-align: center; margin-top: -8px; }
        .home-divider { display: flex; align-items: center; gap: 12px; width: 100%; margin: 4px 0; }
        .home-divider::before, .home-divider::after { content:''; flex:1; height:1px; background: var(--border); }
        .home-divider span { font-size:13px; color:var(--text-muted); letter-spacing:1px; }
        .btn {
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.3px;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: linear-gradient(135deg, #5b8def 0%, #4a7dde 100%); color: #fff; box-shadow: 0 4px 20px var(--accent-glow); }
        .btn-secondary { background: var(--bg-input); color: var(--text); border: 1px solid var(--border); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn .btn-loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        .input-group { width: 100%; display: flex; flex-direction: column; gap: 6px; }
        .input-label { font-size: 13px; color: var(--text-secondary); font-weight: 500; }
        .input-field {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-input);
            color: var(--text);
            font-size: 17px;
            font-weight: 500;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            -webkit-user-select: text;
            user-select: text;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .input-field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
        .error-text { font-size: 13px; color: var(--danger); min-height: 20px; text-align: center; }

        /* 房间等待/游戏界面 */
        #room-screen { background: var(--bg); }
        .room-header {
            height: var(--header-h);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            z-index: 10;
        }
        .header-left { display: flex; align-items: center; gap: 6px; min-width: 0; }
        .btn-back { background: none; border: none; color: var(--text); font-size: 24px; padding: 6px 8px; cursor: pointer; border-radius: 8px; }
        .btn-back:active { background: var(--bg-input); }
        .room-info { display: flex; flex-direction: column; min-width: 0; }
        .room-code-row { display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .room-code { font-size: 15px; font-weight: 700; color: var(--text); letter-spacing: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .copy-icon { font-size: 13px; opacity: 0.6; flex-shrink: 0; }
        .room-status { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
        .status-dot.connecting { background: var(--warning); animation: pulse 1.2s infinite; }
        .status-dot.online { background: var(--success); }
        .status-dot.offline { background: var(--danger); }
        .header-right { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
        .peer-badge { display: flex; align-items: center; gap: 5px; background: var(--bg-input); border-radius: 20px; padding: 5px 12px; font-size: 13px; font-weight: 600; color: var(--text-secondary); }
        .peer-badge .count { color: var(--accent); font-weight: 700; }

        .room-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .player-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .player-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }
        .player-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #fff;
            background: var(--accent);
            flex-shrink: 0;
        }
        .player-name { font-weight: 600; font-size: 15px; }
        .player-badge { font-size: 12px; color: var(--text-muted); margin-left: auto; }
        .waiting-hint {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 14px;
            animation: pulse 2s infinite;
        }

        .toast {
            position: fixed;
            top: calc(var(--safe-top) + 60px);
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: var(--bg-secondary);
            color: var(--text);
            padding: 10px 20px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 1100;
            white-space: nowrap;
            max-width: 90%;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success { border-color: var(--success); color: var(--success); }
        .toast.error { border-color: var(--danger); color: var(--danger); }

        @media (min-width: 600px) {
            .home-container { max-width: 360px; }
            #room-screen { max-width: 600px; margin: 0 auto; border-left: 1px solid var(--border); border-right: 1px solid var(--border); box-shadow: var(--shadow); }
        }
    </style>
</head>
<body>

    <!-- 首页 -->
    <div id="home-screen" class="screen active">
        <div class="home-container">
            <div class="app-icon">🐺</div>
            <div class="app-title">狼人杀 · 房间系统</div>
            <div class="app-subtitle">Supabase 房间验证 + Trystero P2P 通信</div>

            <button id="btn-create" class="btn btn-primary">
                <span class="btn-text">➕ 创建房间</span>
            </button>

            <div class="home-divider"><span>或</span></div>

            <div class="input-group">
                <label class="input-label" for="room-id-input">输入房间码加入</label>
                <input id="room-id-input" class="input-field" type="text"
                placeholder="例如: K7M3PX" maxlength="6" autocomplete="off"
                autocapitalize="characters" spellcheck="false">
            </div>

            <button id="btn-join" class="btn btn-secondary">
                <span class="btn-text">🚪 加入房间</span>
            </button>

            <div id="home-error" class="error-text"></div>
        </div>
    </div>

    <!-- 房间界面 -->
    <div id="room-screen" class="screen">
        <header class="room-header">
            <div class="header-left">
                <button id="btn-leave" class="btn-back" aria-label="离开">←</button>
                <div class="room-info">
                    <div class="room-code-row" id="room-code-copy">
                        <span class="room-code" id="room-code-display">------</span>
                        <span class="copy-icon">📋</span>
                    </div>
                    <div class="room-status">
                        <span id="status-dot" class="status-dot connecting"></span>
                        <span id="status-text">正在连接...</span>
                    </div>
                </div>
            </div>
            <div class="header-right">
                <div class="peer-badge">
                    👥 <span class="count" id="peer-count">1</span> 人在线
                </div>
            </div>
        </header>

        <div class="room-body">
            <div class="player-list" id="player-list">
                <!-- 动态生成 -->
            </div>
            <div class="waiting-hint" id="waiting-hint">
                等待其他玩家加入...
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Trystero (用于后续 P2P 集成) -->
    <script type="module">
        import { joinRoom, selfId } from 'https://esm.sh/trystero@0.20.0';

        // ==================== 配置 ====================
        const supabaseUrl = 'https://orpoubeydftbdoxatnps.supabase.co';
        const supabaseAnonKey = 'sb_publishable_QpgRQBXjtYfZfKEh98YKVg_WVgyEGSv';
        const APP_ID = 'werewolf-room-test-v1';
        const ROOM_CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        const ROOM_CODE_LENGTH = 6;
        const INITIAL_GRACE_PERIOD = 5000;

        // ==================== 初始化 Supabase ====================
        const supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

        // ==================== DOM 元素 ====================
        const homeScreen = document.getElementById('home-screen');
        const roomScreen = document.getElementById('room-screen');
        const btnCreate = document.getElementById('btn-create');
        const btnJoin = document.getElementById('btn-join');
        const roomIdInput = document.getElementById('room-id-input');
        const homeError = document.getElementById('home-error');
        const btnLeave = document.getElementById('btn-leave');
        const roomCodeDisplay = document.getElementById('room-code-display');
        const roomCodeCopy = document.getElementById('room-code-copy');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const peerCount = document.getElementById('peer-count');
        const playerList = document.getElementById('player-list');
        const waitingHint = document.getElementById('waiting-hint');
        const toast = document.getElementById('toast');

        // ==================== 全局状态 ====================
        let room = null;             // Trystero room 对象（后续使用）
        let currentRoomCode = '';
        let myPeerId = selfId;
        let players = new Map();     // peerId -> {name, color}
        let isHost = false;
        let isJoining = false;
        let intentionalLeave = false;
        let connectionCheckTimer = null;

        // ==================== 工具函数 ====================
        function generateRoomCode() {
            let result = '';
            const bytes = new Uint8Array(ROOM_CODE_LENGTH);
            crypto.getRandomValues(bytes);
            for (let i = 0; i < ROOM_CODE_LENGTH; i++) {
                result += ROOM_CODE_CHARS[bytes[i] % ROOM_CODE_CHARS.length];
            }
            return result;
        }

        function sanitizeRoomId(input) {
            return input.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
        }

        function showToast(message, type = '') {
            toast.textContent = message;
            toast.className = 'toast';
            if (type) toast.classList.add(type);
            void toast.offsetWidth;
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.remove('show'), 2200);
        }

        function setButtonLoading(btn, loading, loadingText = '请稍候...') {
            const span = btn.querySelector('.btn-text');
            if (loading) {
                btn.disabled = true;
                span.innerHTML = `<span class="btn-loading"></span>${loadingText}`;
            } else {
                btn.disabled = false;
                if (btn.id === 'btn-create') span.textContent = '➕ 创建房间';
                if (btn.id === 'btn-join') span.textContent = '🚪 加入房间';
            }
        }

        function showScreen(screen) {
            homeScreen.classList.toggle('active', screen === 'home');
            roomScreen.classList.toggle('active', screen === 'room');
        }

        function updateConnectionStatus(mode, text) {
            statusDot.className = 'status-dot';
            if (mode === 'connecting') statusDot.classList.add('connecting');
            else if (mode === 'online') statusDot.classList.add('online');
            else if (mode === 'offline') statusDot.classList.add('offline');
            statusText.textContent = text;
        }

        function updatePlayerList() {
            playerList.innerHTML = '';
            const sorted = Array.from(players.entries());
            // 先显示自己，再显示其他玩家
            sorted.sort((a, b) => {
                if (a[0] === myPeerId) return -1;
                if (b[0] === myPeerId) return 1;
                return 0;
            });
            for (const [peerId, data] of sorted) {
                const div = document.createElement('div');
                div.className = 'player-item';
                const avatarColor = data.color || '#5b8def';
                div.innerHTML = `
                    <div class="player-avatar" style="background:${avatarColor};">${(data.name || '?').charAt(0)}</div>
                    <span class="player-name">${data.name || '未知玩家'}</span>
                    <span class="player-badge">${peerId === myPeerId ? '你' : ''}</span>
                `;
                playerList.appendChild(div);
            }
            peerCount.textContent = players.size;
        }

        function upsertPlayer(peerId, name, color) {
            if (!players.has(peerId)) {
                players.set(peerId, { name: name || '玩家-' + peerId.substring(0,4), color: color || '#5b8def' });
            } else {
                const p = players.get(peerId);
                if (name) p.name = name;
                if (color) p.color = color;
            }
            updatePlayerList();
        }

        function removePlayer(peerId) {
            players.delete(peerId);
            updatePlayerList();
        }

        // ==================== Supabase 房间操作 ====================
        async function createRoomInSupabase(roomCode, hostPeerId) {
            const { data, error } = await supabase
                .from('rooms')
                .insert([
                    {
                        room_code: roomCode,
                        host_peer_id: hostPeerId,
                        status: 'waiting',
                        current_players: 1,
                        max_players: 8,
                        player_order: [hostPeerId],
                        game_state: {},
                        expires_at: new Date(Date.now() + 2 * 60 * 60 * 1000).toISOString()
                    }
                ])
                .select()
                .single();
            if (error) throw error;
            return data;
        }

        async function checkRoomExists(roomCode) {
            const now = new Date().toISOString();
            const { data, error } = await supabase
                .from('rooms')
                .select('room_code, status, current_players, max_players, player_order')
                .eq('room_code', roomCode.toUpperCase())
                .gt('expires_at', now)
                .maybeSingle();
            if (error) throw error;
            return data;
        }

        async function updatePlayerListInSupabase(roomCode, playerOrder, currentPlayers) {
            const { error } = await supabase
                .from('rooms')
                .update({ player_order: playerOrder, current_players: currentPlayers, updated_at: new Date() })
                .eq('room_code', roomCode);
            if (error) console.error('更新玩家列表失败:', error);
        }

        async function closeRoomInSupabase(roomCode) {
            const { error } = await supabase
                .from('rooms')
                .update({ status: 'closed', closed_at: new Date(), updated_at: new Date() })
                .eq('room_code', roomCode);
            if (error) console.error('关闭房间失败:', error);
        }

        // ==================== Trystero 房间连接（占位，后续扩展） ====================
        async function connectToTrysteroRoom(roomCode) {
            try {
                room = joinRoom({ appId: APP_ID }, roomCode);
                // 设置事件监听（后续游戏逻辑在这里）
                room.onPeerJoin((peerId) => {
                    console.log('玩家加入 P2P:', peerId);
                    upsertPlayer(peerId, '玩家-' + peerId.substring(0,4), '#e17055');
                    showToast('新玩家加入', 'success');
                    // 更新 Supabase 中的玩家列表
                    const currentPlayers = players.size;
                    const playerOrder = Array.from(players.keys());
                    updatePlayerListInSupabase(currentRoomCode, playerOrder, currentPlayers);
                });

                room.onPeerLeave((peerId) => {
                    console.log('玩家离开 P2P:', peerId);
                    removePlayer(peerId);
                    showToast('玩家离开', 'info');
                    const currentPlayers = players.size;
                    const playerOrder = Array.from(players.keys());
                    updatePlayerListInSupabase(currentRoomCode, playerOrder, currentPlayers);
                });

                // 添加自己
                upsertPlayer(myPeerId, '我', '#5b8def');
                updateConnectionStatus('online', '已连接');
                return room;
            } catch (err) {
                console.error('Trystero 连接失败:', err);
                throw err;
            }
        }

        // ==================== 创建房间流程 ====================
        async function handleCreateRoom() {
            if (isJoining) return;
            homeError.textContent = '';
            setButtonLoading(btnCreate, true, '创建中...');
            isJoining = true;
            intentionalLeave = false;

            try {
                // 生成房间码
                const roomCode = generateRoomCode();
                currentRoomCode = roomCode;
                isHost = true;
                players.clear();

                // 插入 Supabase
                await createRoomInSupabase(roomCode, myPeerId);
                console.log('Supabase 房间记录创建成功');

                // 连接 Trystero（暂未真正使用，但保留）
                await connectToTrysteroRoom(roomCode);

                // 更新 UI
                roomCodeDisplay.textContent = roomCode;
                showScreen('room');
                updatePlayerList();
                showToast('✅ 房间创建成功', 'success');
                waitingHint.textContent = '等待其他玩家加入...';

                // 启动连接检查（简单轮询）
                startConnectionCheck();

            } catch (err) {
                console.error('创建房间失败:', err);
                homeError.textContent = '创建失败，请检查网络或重试';
                showToast('❌ 创建房间失败', 'error');
                // 清理可能已创建的 Supabase 记录（如果已经插入但 Trystero 失败）
                if (currentRoomCode) {
                    await closeRoomInSupabase(currentRoomCode).catch(() => {});
                }
            } finally {
                setButtonLoading(btnCreate, false);
                isJoining = false;
            }
        }

        // ==================== 加入房间流程 ====================
        async function handleJoinRoom() {
            if (isJoining) return;
            const rawCode = sanitizeRoomId(roomIdInput.value);
            if (rawCode.length !== ROOM_CODE_LENGTH) {
                homeError.textContent = '请输入6位房间码';
                roomIdInput.focus();
                return;
            }
            homeError.textContent = '';
            setButtonLoading(btnJoin, true, '加入中...');
            isJoining = true;
            intentionalLeave = false;

            try {
                // 检查 Supabase 中是否存在
                const roomData = await checkRoomExists(rawCode);
                if (!roomData) {
                    homeError.textContent = '房间不存在或已过期';
                    showToast('❌ 房间不存在', 'error');
                    return;
                }
                if (roomData.status !== 'waiting') {
                    homeError.textContent = '房间已开始游戏或已关闭';
                    showToast('❌ 房间不可加入', 'error');
                    return;
                }
                if (roomData.current_players >= roomData.max_players) {
                    homeError.textContent = '房间已满';
                    showToast('❌ 房间已满', 'error');
                    return;
                }

                // 房间有效，准备加入
                currentRoomCode = rawCode;
                isHost = false;
                players.clear();

                // 连接 Trystero
                await connectToTrysteroRoom(rawCode);

                // 更新 Supabase 中的玩家列表（在 onPeerJoin 中也会更新）
                // 这里先添加自己到本地
                upsertPlayer(myPeerId, '我', '#5b8def');
                updatePlayerList();
                const playerOrder = Array.from(players.keys());
                await updatePlayerListInSupabase(rawCode, playerOrder, players.size);

                // 更新 UI
                roomCodeDisplay.textContent = rawCode;
                showScreen('room');
                showToast('✅ 已加入房间', 'success');
                waitingHint.textContent = '已加入，等待房主开始游戏...';

                startConnectionCheck();

            } catch (err) {
                console.error('加入房间失败:', err);
                homeError.textContent = '加入失败，请检查网络或稍后重试';
                showToast('❌ 加入房间失败', 'error');
            } finally {
                setButtonLoading(btnJoin, false);
                isJoining = false;
            }
        }

        // ==================== 离开房间 ====================
        async function leaveRoom() {
            intentionalLeave = true;
            stopConnectionCheck();
            if (room) {
                try { room.leave(); } catch (e) {}
                room = null;
            }
            if (isHost && currentRoomCode) {
                await closeRoomInSupabase(currentRoomCode);
            } else if (currentRoomCode) {
                // 非房主离开：从 player_order 中移除自己
                try {
                    const { data } = await supabase
                        .from('rooms')
                        .select('player_order, current_players')
                        .eq('room_code', currentRoomCode)
                        .maybeSingle();
                    if (data && Array.isArray(data.player_order)) {
                        const newOrder = data.player_order.filter(id => id !== myPeerId);
                        await supabase
                            .from('rooms')
                            .update({ player_order: newOrder, current_players: newOrder.length, updated_at: new Date() })
                            .eq('room_code', currentRoomCode);
                    }
                } catch (e) { console.error('离开更新失败:', e); }
            }
            players.clear();
            currentRoomCode = '';
            isHost = false;
            roomCodeDisplay.textContent = '------';
            showScreen('home');
            showToast('已离开房间', 'info');
        }

        // ==================== 连接检查（简单版） ====================
        function startConnectionCheck() {
            stopConnectionCheck();
            connectionCheckTimer = setInterval(() => {
                if (!room || intentionalLeave) return;
                // 简单示例：检查 P2P peers 数量（Trystero 可能提供 getPeers 方法）
                // 这里仅作为占位
                updateConnectionStatus('online', `${players.size - 1} 个连接`);
            }, 5000);
        }

        function stopConnectionCheck() {
            if (connectionCheckTimer) {
                clearInterval(connectionCheckTimer);
                connectionCheckTimer = null;
            }
        }

        // ==================== 事件绑定 ====================
        btnCreate.addEventListener('click', handleCreateRoom);
        btnJoin.addEventListener('click', handleJoinRoom);
        roomIdInput.addEventListener('input', () => {
            roomIdInput.value = sanitizeRoomId(roomIdInput.value);
            homeError.textContent = '';
        });
        roomIdInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); handleJoinRoom(); }
        });
        btnLeave.addEventListener('click', leaveRoom);
        roomCodeCopy.addEventListener('click', async () => {
            if (!currentRoomCode) return;
            try {
                await navigator.clipboard.writeText(currentRoomCode);
                showToast('📋 房间码已复制', 'success');
            } catch (err) {
                // 降级方案
                const textarea = document.createElement('textarea');
                textarea.value = currentRoomCode;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('📋 房间码已复制', 'success');
            }
        });

        // ==================== 初始化 ====================
        function init() {
            roomIdInput.placeholder = `例如: ${generateRoomCode()}`;
            showScreen('home');
            console.log('🐺 狼人杀房间系统已加载');
            console.log('Supabase URL:', supabaseUrl);
            console.log('我的 Peer ID:', myPeerId);
        }
        init();
    </script>
</body>
</html>
