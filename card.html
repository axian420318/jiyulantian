<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>卡牌制作</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2canvas CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- 引入高品质开源中文字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;700&family=Noto+Serif+SC:wght@400;700&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
    <style>
        /* 隐藏滚动条 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* 禁用默认手势防止干扰双指缩放 */
        .touch-none {
            touch-action: none;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col lg:flex-row text-slate-800 font-sans">

    <!-- 左侧专业控制面板 -->
    <div class="w-full lg:w-96 bg-white shadow-xl p-6 flex flex-col justify-between overflow-y-auto no-scrollbar lg:h-screen z-20 border-r border-slate-100">
        <div class="space-y-6">
            <div>
                <h1 class="text-lg font-bold text-slate-900 tracking-wide">卡牌生成器</h1>
            </div>

            <!-- 1. 卡框管理 -->
            <div class="border-t border-slate-100 pt-4 space-y-2">
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">卡框选择</label>
                
                <!-- 预设图床卡框切换 -->
                <div class="grid grid-cols-4 gap-2">
                    <button onclick="setFrame('https://i.ibb.co/WWm2gqWf/Image-670596257278124.png', this)" class="frame-btn py-2 px-1 bg-slate-50 hover:bg-slate-100 border-2 border-transparent text-xs font-semibold rounded text-slate-700 transition-all">蓝色</button>
                    <button onclick="setFrame('https://i.ibb.co/rfRb3VDx/Image-671302598020397.png', this)" class="frame-btn py-2 px-1 bg-slate-50 hover:bg-slate-100 border-2 border-transparent text-xs font-semibold rounded text-slate-700 transition-all">金色</button>
                    <button onclick="setFrame('https://i.ibb.co/d0FhfDRc/image.png', this)" class="frame-btn py-2 px-1 bg-slate-50 hover:bg-slate-100 border-2 border-blue-600 text-xs font-semibold rounded text-slate-700 transition-all">灰色</button>
                    <button onclick="document.getElementById('frameInput').click()" class="py-2 px-1 bg-slate-50 hover:bg-slate-100 border border-slate-200 text-xs font-semibold rounded text-slate-500 transition-all overflow-hidden text-ellipsis whitespace-nowrap">自定义</button>
                </div>
                
                <input type="file" id="frameInput" accept="image/*" class="hidden" />
            </div>

            <!-- 2. 卡面管理 -->
            <div class="border-t border-slate-100 pt-4 space-y-3">
                <div class="flex items-center justify-between">
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider">卡面设置</label>
                    
                    <!-- 卡面锁定状态开关 -->
                    <label class="inline-flex items-center cursor-pointer select-none">
                        <input type="checkbox" id="lockArtCheckbox" class="sr-only peer">
                        <div class="relative w-9 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                        <span class="ms-1.5 text-[11px] font-semibold text-slate-500" id="lockText">未锁定</span>
                    </label>
                </div>
                
                <input type="file" id="artInput" accept="image/*" class="w-full text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded file:border file:border-slate-200 file:text-xs file:font-medium file:bg-slate-50 hover:file:bg-slate-100 file:text-slate-700 cursor-pointer" />
                <div class="bg-slate-50 p-2.5 rounded text-[11px] text-slate-500 space-y-1">
                    <p class="font-medium text-slate-700">操作说明：</p>
                    <p>• 开启锁定后可避免在划区或打字时误碰图片</p>
                </div>
            </div>

            <!-- 3. 文本编辑与美术排版工具 -->
            <div class="border-t border-slate-100 pt-4 space-y-3">
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider">卡牌信息编辑</label>
                
                <!-- 基础全局主字体选择 -->
                <div>
                    <label class="block text-[11px] text-slate-400 mb-1">全局基础字体样式</label>
                    <select id="fontFamilySelect" class="w-full p-2 border border-slate-200 rounded text-xs bg-white focus:ring-1 focus:ring-blue-500 focus:outline-none">
                        <option value="'Noto Sans SC', sans-serif">思源黑体 (标准)</option>
                        <option value="'Noto Serif SC', serif">思源宋体 (古典)</option>
                        <option value="'Ma Shan Zheng', cursive">毛笔行楷 (古风)</option>
                        <option value="'ZCOOL QingKe HuangYou', sans-serif">黄油体 (现代艺术)</option>
                        <option value="system-ui, sans-serif">系统默认字体</option>
                    </select>
                </div>

                <!-- 格式化美术工具栏 -->
                <div class="flex flex-wrap items-center gap-1.5 bg-slate-50 p-2 rounded border border-slate-150">
                    <!-- 基本样式 -->
                    <button onclick="insertStyleTag('[b]', '[/b]')" class="h-7 px-2 bg-white hover:bg-slate-100 border border-slate-200 rounded text-xs font-bold" title="加粗">B</button>
                    <button onclick="insertStyleTag('[u]', '[/u]')" class="h-7 px-2 bg-white hover:bg-slate-100 border border-slate-200 rounded text-xs underline" title="下划线">U</button>
                    <button onclick="insertStyleTag('[hl]', '[/hl]')" class="h-7 px-1.5 bg-white hover:bg-slate-100 border border-slate-200 rounded text-xs bg-yellow-50" title="荧光高亮">高亮</button>
                    <button onclick="triggerSegmentColor()" class="h-7 px-1.5 bg-white hover:bg-slate-100 border border-slate-200 rounded text-xs text-red-500 font-semibold" title="局部变色">颜色</button>
                    <input type="color" id="segmentColorPicker" value="#ef4444" class="w-6 h-6 border-0 p-0 cursor-pointer rounded-full hidden" />
                    
                    <div class="h-5 w-px bg-slate-300 mx-0.5"></div>
                    
                    <!-- 局部字号下拉选择 -->
                    <select id="localSizeSelector" onchange="applyLocalSize(this)" class="h-7 px-1 border border-slate-200 rounded text-[11px] bg-white focus:outline-none cursor-pointer">
                        <option value="" disabled selected>字号</option>
                        <option value="20">20px</option>
                        <option value="28">28px</option>
                        <option value="36">36px</option>
                        <option value="44">44px</option>
                        <option value="52">52px</option>
                        <option value="64">64px</option>
                        <option value="80">80px</option>
                    </select>

                    <!-- 局部款式下拉选择 -->
                    <select id="localFontSelector" onchange="applyLocalFont(this)" class="h-7 px-1 border border-slate-200 rounded text-[11px] bg-white focus:outline-none cursor-pointer">
                        <option value="" disabled selected>款式</option>
                        <option value="Noto Sans SC">黑体</option>
                        <option value="Noto Serif SC">宋体</option>
                        <option value="Ma Shan Zheng">楷体</option>
                        <option value="ZCOOL QingKe HuangYou">黄油</option>
                    </select>
                    
                    <button onclick="clearTags()" class="ml-auto text-[10px] text-slate-400 hover:text-red-500 font-medium">清空格式</button>
                </div>

                <!-- 文本编辑区 -->
                <textarea id="cardText" rows="4" class="w-full p-2.5 border border-slate-200 rounded text-sm focus:ring-1 focus:ring-blue-500 focus:border-blue-500 focus:outline-none transition-all placeholder:text-slate-300 font-sans" placeholder="支持选中文字后，通过上方工具栏赋予个别字体局部变色、加粗、局部字号、及特定局部字体款式等高级效果。"></textarea>
                
                <div class="flex items-center space-x-4">
                    <div class="flex-1">
                        <label class="flex justify-between text-xs text-slate-500 mb-1">
                            <span>全局基础字号</span>
                            <span id="fontSizeVal" class="font-mono">32px</span>
                        </label>
                        <input type="range" id="fontSizeRange" min="16" max="80" step="1" value="32" class="w-full h-1 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-500 mb-1">全局颜色</label>
                        <input type="color" id="textColor" value="#2d3748" class="w-12 h-8 border border-slate-200 rounded cursor-pointer p-0.5 bg-white">
                    </div>
                </div>
            </div>

            <!-- 4. 选区调整 (折叠隐藏) -->
            <div class="border-t border-slate-100 pt-4">
                <details class="group">
                    <summary class="flex justify-between items-center text-xs font-semibold text-slate-400 cursor-pointer select-none">
                        <span>版面自定义</span>
                        <span class="transition-transform group-open:rotate-180 text-slate-400">▼</span>
                    </summary>
                    <div class="mt-3 space-y-3 pt-1">
                        <div class="flex items-center justify-between">
                            <span class="text-xs text-slate-600">手动重划文本区域：</span>
                            <button id="toggleSelectorBtn" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded text-xs font-semibold transition-colors">开启选择</button>
                        </div>
                        <textarea id="coordOutput" readonly class="w-full p-2 bg-slate-50 border border-slate-200 rounded text-[10px] font-mono text-slate-500" rows="3" placeholder="此处显示实时坐标数据"></textarea>
                    </div>
                </details>
            </div>
        </div>

        <!-- 5. 导出 -->
        <div class="border-t border-slate-100 pt-4 mt-6">
            <button id="exportBtn" class="w-full py-3 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium text-sm rounded shadow-md transition-colors">
                生成卡牌图片
            </button>
        </div>
    </div>

    <!-- 右侧卡牌预览区 -->
    <div class="flex-1 flex items-center justify-center p-6 overflow-auto">
        
        <!-- 预览外部物理限制容器 (410px * 614px) -->
        <div class="relative bg-slate-100 shadow-2xl rounded-lg overflow-hidden flex items-center justify-center border border-slate-200" style="width: 410px; height: 614px; min-width: 410px; min-height: 614px;">
            
            <!-- 1024x1536 核心画布 -->
            <div id="cardContainer" class="absolute overflow-hidden origin-top-left" style="width: 1024px; height: 1536px; transform: scale(0.4); left: 0; top: 0;">
                
                <!-- 图层 1: 卡面图片容器（全面拦截手势事件） -->
                <div id="artWrapper" class="absolute inset-0 cursor-grab active:cursor-grabbing select-none touch-none" style="z-index: 1;">
                    <img id="artImg" src="" class="absolute origin-center pointer-events-none select-none" style="transform: translate(0px, 0px) scale(1); max-width: none;" alt="" />
                </div>

                <!-- 图层 2: 卡框图片 (引入 crossorigin 并默认指向灰色图层) -->
                <img id="frameImg" crossorigin="anonymous" src="https://i.ibb.co/d0FhfDRc/image.png" class="absolute inset-0 w-full h-full select-none pointer-events-none" style="z-index: 10;" alt="卡框加载中..." />

                <!-- 图层 3: 文字信息区域 (采用最新确定的坐标范围) -->
                <div id="textRegion" class="absolute break-words overflow-hidden" style="z-index: 20; left: 80px; top: 1038px; width: 852px; height: 413px; color: #2d3748; font-size: 32px; line-height: 1.5; font-family: 'Noto Sans SC', sans-serif; word-wrap: break-word; white-space: pre-wrap;">这里是[b]加粗效果[/b]、[u]下划线效果[/u]以及[hl]高亮文本背景[/hl]的演示。您还可以随时[c=#ef4444]插入任意分段文字颜色[/c]。也可以使用特定[size=52]局部字号大小放大[/size]或切换[font=Ma Shan Zheng]局部字体款式[/font]。</div>

                <!-- 图层 4: 区域选择交互遮罩层 -->
                <div id="selectionOverlay" class="absolute inset-0 bg-black/40 hidden cursor-crosshair touch-none" style="z-index: 30;">
                    <div id="selectionBox" class="absolute border-2 border-dashed border-red-500 bg-red-500/10 hidden pointer-events-none">
                        <span class="absolute -top-6 left-0 bg-red-500 text-white text-[10px] px-1 py-0.5 rounded font-sans">新文本区域</span>
                        <button id="selectionConfirmBtn" class="absolute -bottom-12 right-0 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-1.5 rounded shadow-lg pointer-events-auto cursor-pointer">
                            确认区域
                        </button>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <script>
        // 核心元素获取
        const frameInput = document.getElementById('frameInput');
        const artInput = document.getElementById('artInput');
        const lockArtCheckbox = document.getElementById('lockArtCheckbox');
        const lockText = document.getElementById('lockText');
        
        const cardText = document.getElementById('cardText');
        const fontSizeRange = document.getElementById('fontSizeRange');
        const fontSizeVal = document.getElementById('fontSizeVal');
        const textColor = document.getElementById('textColor');
        const fontFamilySelect = document.getElementById('fontFamilySelect');
        const segmentColorPicker = document.getElementById('segmentColorPicker');
        const localSizeSelector = document.getElementById('localSizeSelector');
        const localFontSelector = document.getElementById('localFontSelector');

        const toggleSelectorBtn = document.getElementById('toggleSelectorBtn');
        const coordOutput = document.getElementById('coordOutput');
        const exportBtn = document.getElementById('exportBtn');

        const cardContainer = document.getElementById('cardContainer');
        const frameImg = document.getElementById('frameImg');
        const artImg = document.getElementById('artImg');
        const artWrapper = document.getElementById('artWrapper');
        const textRegion = document.getElementById('textRegion');
        const selectionOverlay = document.getElementById('selectionOverlay');
        const selectionBox = document.getElementById('selectionBox');
        const selectionConfirmBtn = document.getElementById('selectionConfirmBtn');

        // 固定物理缩放参数
        const PREVIEW_SCALE = 0.4;

        // 卡面位置及缩放状态
        let artState = {
            x: 0,
            y: 0,
            scale: 1,
            isDragging: false,
            startX: 0,
            startY: 0
        };

        // 双指触摸缩放追踪数据
        let activePointers = {};
        let initialDistance = 0;
        let initialScale = 1;

        // 1. 卡框切换控制 (添加跨域安全及时间戳逻辑)
        function setFrame(src, btnElement) {
            // 每次切换时强制显式声明跨域匿名模式
            frameImg.removeAttribute('crossorigin');
            frameImg.setAttribute('crossorigin', 'anonymous');
            
            // 附加动态时间戳防止浏览器强行读取无CORS头的缓存文件
            const cacheBuster = src + "?t=" + new Date().getTime();
            frameImg.src = cacheBuster;

            document.querySelectorAll('.frame-btn').forEach(btn => {
                btn.classList.remove('border-blue-600');
                btn.classList.add('border-transparent');
            });
            if (btnElement) {
                btnElement.classList.remove('border-transparent');
                btnElement.classList.add('border-blue-600');
            }
        }

        frameInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                frameImg.removeAttribute('crossorigin'); // 本地图片无需声明跨域
                frameImg.src = url;
                // 取消默认卡框高亮
                document.querySelectorAll('.frame-btn').forEach(btn => {
                    btn.classList.remove('border-blue-600');
                    btn.classList.add('border-transparent');
                });
            }
        });

        // 2. 卡面导入
        artInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                artImg.src = url;
                artState.x = 0;
                artState.y = 0;
                artState.scale = 1;
                updateArtTransform();
            }
        });

        // 锁定控制监听
        lockArtCheckbox.addEventListener('change', (e) => {
            if (e.target.checked) {
                lockText.innerText = "已锁定";
                lockText.classList.remove('text-slate-500');
                lockText.classList.add('text-blue-600');
            } else {
                lockText.innerText = "未锁定";
                lockText.classList.remove('text-blue-600');
                lockText.classList.add('text-slate-500');
            }
        });

        function updateArtTransform() {
            artImg.style.transform = `translate(${artState.x}px, ${artState.y}px) scale(${artState.scale})`;
        }

        // 辅助计算：多点触控距离
        function getDistance(p1, p2) {
            const dx = p1.clientX - p2.clientX;
            const dy = p1.clientY - p2.clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        // 3. 卡面手势逻辑
        artWrapper.addEventListener('pointerdown', (e) => {
            if (isSelectionMode || lockArtCheckbox.checked) return;
            if (!artImg.src) return;
            
            activePointers[e.pointerId] = e;
            const pointers = Object.values(activePointers);

            if (pointers.length === 1) {
                artState.isDragging = true;
                artWrapper.setPointerCapture(e.pointerId);
                artState.startX = (e.clientX / PREVIEW_SCALE) - artState.x;
                artState.startY = (e.clientY / PREVIEW_SCALE) - artState.y;
            } else if (pointers.length === 2) {
                artState.isDragging = false; 
                initialDistance = getDistance(pointers[0], pointers[1]);
                initialScale = artState.scale;
            }
        });

        artWrapper.addEventListener('pointermove', (e) => {
            if (lockArtCheckbox.checked) return;
            activePointers[e.pointerId] = e;
            const pointers = Object.values(activePointers);

            if (pointers.length === 1 && artState.isDragging) {
                artState.x = (e.clientX / PREVIEW_SCALE) - artState.startX;
                artState.y = (e.clientY / PREVIEW_SCALE) - artState.startY;
                updateArtTransform();
            } else if (pointers.length === 2 && initialDistance > 0) {
                const currentDistance = getDistance(pointers[0], pointers[1]);
                const scaleFactor = currentDistance / initialDistance;
                artState.scale = Math.max(0.1, Math.min(5, initialScale * scaleFactor));
                updateArtTransform();
            }
        });

        const handlePointerUp = (e) => {
            delete activePointers[e.pointerId];
            if (Object.values(activePointers).length < 2) {
                initialDistance = 0;
            }
            if (artState.isDragging) {
                artState.isDragging = false;
                try { artWrapper.releasePointerCapture(e.pointerId); } catch(err) {}
            }
        };

        artWrapper.addEventListener('pointerup', handlePointerUp);
        artWrapper.addEventListener('pointercancel', handlePointerUp);

        // 电脑端：鼠标滚轮缩放
        artWrapper.addEventListener('wheel', (e) => {
            if (!artImg.src || isSelectionMode || lockArtCheckbox.checked) return;
            e.preventDefault();
            const step = 0.05;
            if (e.deltaY < 0) {
                artState.scale = Math.min(5, artState.scale + step);
            } else {
                artState.scale = Math.max(0.1, artState.scale - step);
            }
            updateArtTransform();
        }, { passive: false });


        // 4. 富文本解析算法
        function parseCardMarkup(text) {
            let safeText = text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");

            // [b] -> 加粗
            safeText = safeText.replace(/\[b\](.*?)\[\/b\]/g, '<span class="font-bold">$1</span>');
            
            // [u] -> 下划线
            safeText = safeText.replace(/\[u\](.*?)\[\/u\]/g, '<span style="text-decoration: underline;">$1</span>');

            // [hl] -> 背景高亮
            safeText = safeText.replace(/\[hl\](.*?)\[\/hl\]/g, '<span style="background-color: #fef08a; color: #1e293b; padding: 2px 6px; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">$1</span>');

            // [c=#HEX] -> 局部颜色
            safeText = safeText.replace(/\[c=(#[0-9a-fA-F]{6})\](.*?)\[\/c\]/g, '<span style="color: $1;">$2</span>');

            // [size=XX] -> 局部字号
            safeText = safeText.replace(/\[size=(\d+)\](.*?)\[\/size\]/g, '<span style="font-size: $1px; line-height: 1.1;">$2</span>');

            // [font=XXX] -> 局部字体款式
            safeText = safeText.replace(/\[font=([^\]]+)\](.*?)\[\/font\]/g, '<span style="font-family: \'$1\';">$2</span>');

            return safeText;
        }

        // 渲染文本
        function renderText() {
            const rawContent = cardText.value || '（在此输入卡牌文字信息）';
            textRegion.innerHTML = parseCardMarkup(rawContent);
        }

        cardText.addEventListener('input', renderText);

        fontFamilySelect.addEventListener('change', (e) => {
            textRegion.style.fontFamily = e.target.value;
        });

        fontSizeRange.addEventListener('input', (e) => {
            const size = e.target.value;
            fontSizeVal.innerText = `${size}px`;
            textRegion.style.fontSize = `${size}px`;
        });

        textColor.addEventListener('input', (e) => {
            textRegion.style.color = e.target.value;
        });


        // 5. 富文本标签插入及清空
        function insertStyleTag(openTag, closeTag) {
            const start = cardText.selectionStart;
            const end = cardText.selectionEnd;
            const fullText = cardText.value;
            const selectedText = fullText.substring(start, end);

            const modifiedText = openTag + selectedText + closeTag;
            cardText.value = fullText.substring(0, start) + modifiedText + fullText.substring(end);

            renderText();
            cardText.focus();
            cardText.setSelectionRange(start + openTag.length, start + openTag.length + selectedText.length);
        }

        function triggerSegmentColor() {
            segmentColorPicker.click();
        }

        segmentColorPicker.addEventListener('input', (e) => {
            insertStyleTag(`[c=${e.target.value}]`, '[/c]');
        });

        // 应用局部字号
        function applyLocalSize(select) {
            const sizeValue = select.value;
            if (sizeValue) {
                insertStyleTag(`[size=${sizeValue}]`, '[/size]');
                select.value = ""; // 归位选择器
            }
        }

        // 应用局部款式
        function applyLocalFont(select) {
            const fontValue = select.value;
            if (fontValue) {
                insertStyleTag(`[font=${fontValue}]`, '[/font]');
                select.value = ""; // 归位选择器
            }
        }

        // 清空所有排版格式标签
        function clearTags() {
            let cleared = cardText.value;
            cleared = cleared.replace(/\[b\]/g, '').replace(/\[\/b\]/g, '');
            cleared = cleared.replace(/\[u\]/g, '').replace(/\[\/u\]/g, '');
            cleared = cleared.replace(/\[hl\]/g, '').replace(/\[\/hl\]/g, '');
            cleared = cleared.replace(/\[c=#[0-9a-fA-F]{6}\]/g, '').replace(/\[\/c\]/g, '');
            cleared = cleared.replace(/\[size=\d+\]/g, '').replace(/\[\/size\]/g, '');
            cleared = cleared.replace(/\[font=[^\]]+\]/g, '').replace(/\[\/font\]/g, '');
            cardText.value = cleared;
            renderText();
        }


        // 6. 文本区域手动重划工具逻辑
        let isSelectionMode = false;
        let selectionState = {
            isDrawing: false,
            startX: 0,
            startY: 0
        };

        function enterSelectionMode() {
            isSelectionMode = true;
            toggleSelectorBtn.innerText = '关闭选择';
            toggleSelectorBtn.classList.remove('bg-slate-100');
            toggleSelectorBtn.classList.add('bg-red-500', 'text-white');
            selectionOverlay.classList.remove('hidden');
        }

        function exitSelectionMode() {
            isSelectionMode = false;
            toggleSelectorBtn.innerText = '开启选择';
            toggleSelectorBtn.classList.remove('bg-red-500', 'text-white');
            toggleSelectorBtn.classList.add('bg-slate-100');
            selectionOverlay.classList.add('hidden');
            selectionBox.classList.add('hidden');
        }

        toggleSelectorBtn.addEventListener('click', () => {
            if (isSelectionMode) {
                exitSelectionMode();
            } else {
                enterSelectionMode();
            }
        });

        selectionOverlay.addEventListener('pointerdown', (e) => {
            if (!isSelectionMode) return;
            if (e.target === selectionConfirmBtn || selectionConfirmBtn.contains(e.target)) return;

            selectionState.isDrawing = true;
            selectionOverlay.setPointerCapture(e.pointerId);

            const rect = cardContainer.getBoundingClientRect();
            selectionState.startX = (e.clientX - rect.left) / PREVIEW_SCALE;
            selectionState.startY = (e.clientY - rect.top) / PREVIEW_SCALE;

            selectionBox.style.left = `${selectionState.startX}px`;
            selectionBox.style.top = `${selectionState.startY}px`;
            selectionBox.style.width = '0px';
            selectionBox.style.height = '0px';
            selectionBox.classList.remove('hidden');
        });

        selectionOverlay.addEventListener('pointermove', (e) => {
            if (!selectionState.isDrawing) return;

            const rect = cardContainer.getBoundingClientRect();
            const currentX = (e.clientX - rect.left) / PREVIEW_SCALE;
            const currentY = (e.clientY - rect.top) / PREVIEW_SCALE;

            const targetX = Math.max(0, Math.min(1024, currentX));
            const targetY = Math.max(0, Math.min(1536, currentY));

            const left = Math.min(selectionState.startX, targetX);
            const top = Math.min(selectionState.startY, targetY);
            const width = Math.abs(selectionState.startX - targetX);
            const height = Math.abs(selectionState.startY - targetY);

            selectionBox.style.left = `${left}px`;
            selectionBox.style.top = `${top}px`;
            selectionBox.style.width = `${width}px`;
            selectionBox.style.height = `${height}px`;
        });

        selectionOverlay.addEventListener('pointerup', (e) => {
            if (!selectionState.isDrawing) return;
            selectionState.isDrawing = false;
            try { selectionOverlay.releasePointerCapture(e.pointerId); } catch(err) {}
        });

        selectionConfirmBtn.addEventListener('click', (e) => {
            e.stopPropagation();

            const left = parseInt(selectionBox.style.left);
            const top = parseInt(selectionBox.style.top);
            const width = parseInt(selectionBox.style.width);
            const height = parseInt(selectionBox.style.height);

            if (width > 10 && height > 10) {
                textRegion.style.left = `${left}px`;
                textRegion.style.top = `${top}px`;
                textRegion.style.width = `${width}px`;
                textRegion.style.height = `${height}px`;

                const configStr = `{\n  "left": ${left},\n  "top": ${top},\n  "width": ${width},\n  "height": ${height}\n}`;
                coordOutput.value = configStr;

                exitSelectionMode();
            }
        });


        // 7. 导出生成 1024×1536 标准高分辨率卡牌 (html2canvas CORS 配置模式)
        exportBtn.addEventListener('click', () => {
            const isSelectorWasOpen = isSelectionMode;
            if (isSelectorWasOpen) {
                selectionOverlay.classList.add('hidden');
            }

            exportBtn.innerText = '正在生成高清晰度图像...';
            exportBtn.disabled = true;

            // 临时重置 CSS Transform 比例，确保 100% 物理真实尺寸渲染
            cardContainer.style.transform = 'none';

            html2canvas(cardContainer, {
                width: 1024,
                height: 1536,
                scale: 1, 
                useCORS: true,       // 允许读取外域跨域资源
                allowTaint: false,   // 禁止污染画布保证 dataURL 能成功导出
                backgroundColor: null,
                logging: false
            }).then(canvas => {
                cardContainer.style.transform = 'scale(0.4)';

                const link = document.createElement('a');
                link.download = 'card_export.png';
                link.href = canvas.toDataURL('image/png');
                link.click();

                if (isSelectorWasOpen) {
                    selectionOverlay.classList.remove('hidden');
                }
                exportBtn.innerText = '生成卡牌图片';
                exportBtn.disabled = false;
            }).catch(err => {
                console.error("生成失败:", err);
                cardContainer.style.transform = 'scale(0.4)';
                alert("生成图像失败，请检查素材跨域及加载情况。");
                exportBtn.innerText = '生成卡牌图片';
                exportBtn.disabled = false;
            });
        });

        // 页面首次初始化渲染
        window.addEventListener('DOMContentLoaded', () => {
            renderText();
        });
    </script>
</body>
</html>
