<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LiveKit 语音通话</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 10px 20px;
      margin-right: 10px;
      border: none;
      border-radius: 4px;
      background: #007bff;
      color: white;
      cursor: pointer;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    button.danger {
      background: #dc3545;
    }
    #status {
      margin-top: 20px;
      padding: 10px;
      border-radius: 4px;
      background: #f8f9fa;
    }
    #participants {
      margin-top: 10px;
      list-style: none;
      padding: 0;
    }
    #participants li {
      padding: 5px 0;
      border-bottom: 1px solid #eee;
    }
  </style>
</head>
<body>
  <h1>LiveKit 实时语音通话</h1>

  <div class="form-group">
    <label for="room">房间名</label>
    <input type="text" id="room" placeholder="例如：my-room" value="test-room" />
  </div>
  <div class="form-group">
    <label for="identity">用户名</label>
    <input type="text" id="identity" placeholder="你的名字" value="user-1" />
  </div>

  <button id="joinBtn">加入房间</button>
  <button id="leaveBtn" class="danger" disabled>离开房间</button>
  <button id="muteBtn" disabled>静音</button>

  <div id="status">未连接</div>

  <h3>参与者</h3>
  <ul id="participants"></ul>

  <!-- 引入 LiveKit JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
  <script>
    // ========== 配置（生产环境请勿在前端暴露 API Secret！） ==========
    const LIVEKIT_URL = "wss://wangguosha-i78zv7oq.livekit.cloud";
    const API_KEY = "APIY4Zjj7vJQpqk";
    const API_SECRET = "eGredEZDzQ1U6LtYRF4Le4ju6F0cpkS5BMfT1ftQfNYI";

    // ========== 浏览器内生成 LiveKit Token ==========
    function base64UrlEncode(input) {
      let str;
      if (input instanceof ArrayBuffer) {
        str = String.fromCharCode(...new Uint8Array(input));
      } else {
        str = input;
      }
      return btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    async function generateToken(apiKey, apiSecret, roomName, identity) {
      const now = Math.floor(Date.now() / 1000);
      const header = {
        alg: "HS256",
        typ: "JWT"
      };
      const payload = {
        iss: apiKey,
        sub: identity,
        nbf: now,
        exp: now + 3600, // 1小时有效
        video: {
          room: roomName,
          roomJoin: true,
          canPublish: true,
          canSubscribe: true
        }
      };

      const headerB64 = base64UrlEncode(JSON.stringify(header));
      const payloadB64 = base64UrlEncode(JSON.stringify(payload));
      const unsignedToken = `${headerB64}.${payloadB64}`;

      const encoder = new TextEncoder();
      const keyData = encoder.encode(apiSecret);
      const cryptoKey = await crypto.subtle.importKey(
        "raw",
        keyData,
        { name: "HMAC", hash: "SHA-256" },
        false,
        ["sign"]
      );
      const signature = await crypto.subtle.sign(
        "HMAC",
        cryptoKey,
        encoder.encode(unsignedToken)
      );
      const signatureB64 = base64UrlEncode(signature);

      return `${unsignedToken}.${signatureB64}`;
    }

    // ========== 页面元素 ==========
    const roomInput = document.getElementById('room');
    const identityInput = document.getElementById('identity');
    const joinBtn = document.getElementById('joinBtn');
    const leaveBtn = document.getElementById('leaveBtn');
    const muteBtn = document.getElementById('muteBtn');
    const statusDiv = document.getElementById('status');
    const participantsList = document.getElementById('participants');

    let room = null;
    let isMuted = false;

    // ========== 更新参与者列表 ==========
    function updateParticipants() {
      participantsList.innerHTML = '';
      if (!room) return;

      room.remoteParticipants.forEach((participant) => {
        const li = document.createElement('li');
        li.textContent = `${participant.identity} (${participant.sid})`;
        participantsList.appendChild(li);
      });

      // 本地参与者
      const localLi = document.createElement('li');
      localLi.textContent = `${room.localParticipant.identity} (你)`;
      participantsList.prepend(localLi);
    }

    // ========== 事件监听 ==========
    function setupRoomEvents() {
      room.on(LivekitClient.RoomEvent.ParticipantConnected, (participant) => {
        statusDiv.textContent = `${participant.identity} 已加入`;
        updateParticipants();
      });

      room.on(LivekitClient.RoomEvent.ParticipantDisconnected, (participant) => {
        statusDiv.textContent = `${participant.identity} 已离开`;
        updateParticipants();
      });

      room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
        if (track.kind === 'audio') {
          // 自动将远程音频附加到新创建的 <audio> 元素并播放
          const audioEl = track.attach();
          audioEl.play().catch((e) => console.warn('自动播放被阻止，请点击页面任意位置', e));
        }
      });

      room.on(LivekitClient.RoomEvent.Disconnected, () => {
        statusDiv.textContent = '已断开连接';
        joinBtn.disabled = false;
        leaveBtn.disabled = true;
        muteBtn.disabled = true;
        participantsList.innerHTML = '';
        room = null;
      });
    }

    // ========== 加入房间 ==========
    joinBtn.addEventListener('click', async () => {
      const roomName = roomInput.value.trim();
      const identity = identityInput.value.trim();
      if (!roomName || !identity) {
        alert('请输入房间名和用户名');
        return;
      }

      joinBtn.disabled = true;
      statusDiv.textContent = '正在生成 Token 并连接...';

      try {
        // 生成访问令牌（注意：生产环境应在服务端生成）
        const token = await generateToken(API_KEY, API_SECRET, roomName, identity);

        // 创建房间实例
        room = new LivekitClient.Room({
          adaptiveStream: true,
          dynacast: true,
        });

        setupRoomEvents();

        // 连接到 LiveKit 服务器
        await room.connect(LIVEKIT_URL, token);
        statusDiv.textContent = '已连接，正在发布麦克风...';

        // 启用麦克风（发布本地音频）
        await room.localParticipant.setMicrophoneEnabled(true);
        statusDiv.textContent = '已加入房间并开启麦克风';

        joinBtn.disabled = true;
        leaveBtn.disabled = false;
        muteBtn.disabled = false;
        updateParticipants();

      } catch (error) {
        console.error('加入房间失败:', error);
        statusDiv.textContent = '连接失败：' + error.message;
        joinBtn.disabled = false;
      }
    });

    // ========== 离开房间 ==========
    leaveBtn.addEventListener('click', async () => {
      if (room) {
        await room.disconnect();
        room = null;
      }
    });

    // ========== 静音/取消静音 ==========
    muteBtn.addEventListener('click', async () => {
      if (!room) return;
      isMuted = !isMuted;
      await room.localParticipant.setMicrophoneEnabled(!isMuted);
      muteBtn.textContent = isMuted ? '取消静音' : '静音';
      statusDiv.textContent = isMuted ? '已静音' : '已取消静音';
    });
  </script>
</body>
</html>
