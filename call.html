<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LiveKit 语音通话</title>
<style>
body{font-family:Arial,sans-serif;max-width:600px;margin:40px auto;padding:0 20px}
input{width:100%;padding:8px;box-sizing:border-box;border:1px solid #ccc;border-radius:4px;margin-bottom:10px}
button{padding:10px 20px;margin-right:10px;border:none;border-radius:4px;background:#007bff;color:white;cursor:pointer}
button:disabled{background:#ccc;cursor:not-allowed}
.danger{background:#dc3545}
#status{margin-top:20px;padding:10px;border-radius:4px;background:#f8f9fa}
ul{list-style:none;padding:0}
li{padding:5px 0;border-bottom:1px solid #eee}
</style>
</head>
<body>
<h1>LiveKit 实时语音通话</h1>
<input id="room" placeholder="房间名" value="test-room">
<input id="identity" placeholder="用户名" value="user-1">
<button id="join">加入房间</button>
<button id="leave" class="danger" disabled>离开</button>
<button id="mute" disabled>静音</button>
<div id="status">未连接</div>
<h3>参与者</h3>
<ul id="participants"></ul>

<script>
// ========== LiveKit 配置（URL 可公开，Worker 地址用于获取 Token） ==========
const LIVEKIT_URL = 'wss://wangguosha-i78zv7oq.livekit.cloud';
const TOKEN_URL = 'https://tiny-river-f5e1.dianzilong8784253.workers.dev/';

// ========== 精简版 LiveKit 语音封装 ==========
class LiveKitVoice {
  constructor() {
    this.room = null;
    this.isMuted = false;
    this.remoteAudioElements = new Map();
    this.eventHandlers = {};
  }

  on(event, handler) {
    if (!this.eventHandlers[event]) this.eventHandlers[event] = [];
    this.eventHandlers[event].push(handler);
  }

  emit(event, data) {
    (this.eventHandlers[event] || []).forEach(fn => fn(data));
  }

  async _getToken(roomName, identity) {
    const response = await fetch(TOKEN_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ roomName, identity }),
    });
    if (!response.ok) throw new Error('获取 Token 失败: ' + response.status);
    const data = await response.json();
    return data.token;
  }

  async _loadSDK() {
    if (window.LivekitClient) return;
    await new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js';
      script.onload = resolve;
      script.onerror = () => reject(new Error('LiveKit SDK 加载失败'));
      document.head.appendChild(script);
    });
  }

  async join(roomName, identity) {
    if (this.room) throw new Error('已在房间中');
    await this._loadSDK();
    const token = await this._getToken(roomName, identity);
    this.emit('connecting', { roomName, identity });
    this.room = new LivekitClient.Room({ adaptiveStream: true, dynacast: true });
    this._setupRoomEvents();
    await this.room.connect(LIVEKIT_URL, token);
    await this.room.localParticipant.setMicrophoneEnabled(true);
    this.isMuted = false;
    this.emit('connected', { localParticipant: this.room.localParticipant, room: this.room });
  }

  async leave() {
    if (!this.room) return;
    await this.room.disconnect();
    this.room = null;
    this.remoteAudioElements.clear();
    this.emit('disconnected');
  }

  async setMuted(muted) {
    if (!this.room) return;
    await this.room.localParticipant.setMicrophoneEnabled(!muted);
    this.isMuted = muted;
    this.emit('mute-changed', { muted });
  }

  async toggleMute() {
    await this.setMuted(!this.isMuted);
  }

  _setupRoomEvents() {
    const room = this.room;
    room.on(LivekitClient.RoomEvent.ParticipantConnected, p => this.emit('participant-joined', p));
    room.on(LivekitClient.RoomEvent.ParticipantDisconnected, p => {
      const el = this.remoteAudioElements.get(p.sid);
      if (el) { el.remove(); this.remoteAudioElements.delete(p.sid); }
      this.emit('participant-left', p);
    });
    room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
      if (track.kind === 'audio') {
        const el = track.attach();
        el.play().catch(e => console.warn('自动播放被阻止', e));
        this.remoteAudioElements.set(participant.sid, el);
        this.emit('track-subscribed', { track, participant });
      }
    });
    room.on(LivekitClient.RoomEvent.TrackUnsubscribed, (track, publication, participant) => {
      if (track.kind === 'audio') {
        const el = this.remoteAudioElements.get(participant.sid);
        if (el) { el.remove(); this.remoteAudioElements.delete(participant.sid); }
      }
    });
    room.on(LivekitClient.RoomEvent.Disconnected, () => {
      this.room = null;
      this.remoteAudioElements.clear();
      this.emit('disconnected');
    });
  }

  getParticipants() {
    if (!this.room) return [];
    const list = [{ identity: this.room.localParticipant.identity, sid: this.room.localParticipant.sid, isLocal: true }];
    this.room.remoteParticipants.forEach(p => list.push({ identity: p.identity, sid: p.sid, isLocal: false }));
    return list;
  }
}

// ========== 页面逻辑 ==========
const voice = new LiveKitVoice();
const roomInput = document.getElementById('room');
const identityInput = document.getElementById('identity');
const joinBtn = document.getElementById('join');
const leaveBtn = document.getElementById('leave');
const muteBtn = document.getElementById('mute');
const statusDiv = document.getElementById('status');
const participantsList = document.getElementById('participants');

function updateParticipants() {
  participantsList.innerHTML = '';
  voice.getParticipants().forEach(p => {
    const li = document.createElement('li');
    li.textContent = p.isLocal ? `${p.identity} (你)` : p.identity;
    participantsList.appendChild(li);
  });
}

voice.on('connecting', () => { statusDiv.textContent = '正在连接...'; });
voice.on('connected', () => {
  statusDiv.textContent = '已连接';
  joinBtn.disabled = true;
  leaveBtn.disabled = false;
  muteBtn.disabled = false;
  updateParticipants();
});
voice.on('disconnected', () => {
  statusDiv.textContent = '已断开';
  joinBtn.disabled = false;
  leaveBtn.disabled = true;
  muteBtn.disabled = true;
  participantsList.innerHTML = '';
});
voice.on('participant-joined', updateParticipants);
voice.on('participant-left', updateParticipants);
voice.on('track-subscribed', data => console.log('收到音频:', data.participant.identity));

joinBtn.addEventListener('click', async () => {
  const room = roomInput.value.trim();
  const identity = identityInput.value.trim();
  if (!room || !identity) return alert('请输入房间名和用户名');
  joinBtn.disabled = true;
  try {
    await voice.join(room, identity);
  } catch (err) {
    console.error(err);
    statusDiv.textContent = '连接失败: ' + err.message;
    joinBtn.disabled = false;
  }
});

leaveBtn.addEventListener('click', () => voice.leave());
muteBtn.addEventListener('click', async () => {
  await voice.toggleMute();
  muteBtn.textContent = voice.isMuted ? '取消静音' : '静音';
});
</script>
</body>
</html>
